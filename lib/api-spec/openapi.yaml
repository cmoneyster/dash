openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Catering Business API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: menu
    description: Menu item operations
  - name: orders
    description: Order and cart operations
  - name: events
    description: Event calendar and availability
  - name: chat
    description: AI chat agent operations
  - name: admin
    description: Admin dashboard operations
  - name: printers
    description: Network receipt printer management (Star CloudPRNT)
  - name: openai
    description: OpenAI AI chat, image, and audio operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Menu endpoints
  /menu:
    get:
      operationId: listMenuItems
      tags: [menu]
      summary: List all menu items
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: available
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
  /menu/{id}:
    get:
      operationId: getMenuItem
      tags: [menu]
      summary: Get a single menu item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Admin menu endpoints
  /admin/menu:
    get:
      operationId: adminListMenuItems
      tags: [admin]
      summary: List all menu items (admin)
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
    post:
      operationId: createMenuItem
      tags: [admin]
      summary: Create a new menu item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMenuItemBody"
      responses:
        "201":
          description: Created menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
  /admin/menu/{id}:
    put:
      operationId: updateMenuItem
      tags: [admin]
      summary: Update a menu item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMenuItemBody"
      responses:
        "200":
          description: Updated menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMenuItem
      tags: [admin]
      summary: Delete a menu item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/menu-items/generate-description:
    post:
      operationId: generateMenuItemDescription
      tags: [admin]
      summary: Generate an AI-written menu item description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDescriptionBody"
      responses:
        "200":
          description: Generated description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateDescriptionResponse"
        "400":
          description: Missing or invalid name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Event / Calendar endpoints
  /events/day-load:
    get:
      operationId: getDayLoad
      tags: [events]
      summary: Combined blackout + per-service-style + global guest-cap view for a single date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Day-load summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayLoadResponse"
        "400":
          description: Invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /events/availability:
    get:
      operationId: checkAvailability
      tags: [events]
      summary: Check availability for a date range
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Availability info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"

  # Admin chat-bot recommended items
  /admin/recommendations:
    get:
      operationId: adminListRecommendations
      tags: [admin]
      summary: List curated chat-bot recommendations
      responses:
        "200":
          description: Recommended items in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecommendedItem"
    post:
      operationId: adminAddRecommendation
      tags: [admin]
      summary: Add a menu item to the recommendations list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRecommendationBody"
      responses:
        "201":
          description: Updated recommendations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecommendedItem"
        "404":
          description: Menu item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Item already in the recommendations list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/recommendations/{menuItemId}:
    delete:
      operationId: adminRemoveRecommendation
      tags: [admin]
      summary: Remove a menu item from the recommendations list
      parameters:
        - name: menuItemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
  /admin/recommendations/reorder:
    patch:
      operationId: adminReorderRecommendations
      tags: [admin]
      summary: Reorder the recommendations list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRecommendationsBody"
      responses:
        "200":
          description: Updated recommendations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecommendedItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/recommendations/top-sellers:
    get:
      operationId: adminListTopSellers
      tags: [admin]
      summary: Compute top-selling menu items from real order data
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Top sellers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopSeller"
  /admin/recommendations/sync:
    post:
      operationId: adminSyncRecommendations
      tags: [admin]
      summary: Apply top sellers to the recommendations list (replace or merge)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRecommendationsBody"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRecommendationsResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/blackout-dates:
    get:
      operationId: listBlackoutDates
      tags: [admin]
      summary: List all blackout dates
      responses:
        "200":
          description: Blackout dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlackoutDate"
    post:
      operationId: createBlackoutDate
      tags: [admin]
      summary: Add a blackout date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBlackoutDateBody"
      responses:
        "201":
          description: Created blackout date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlackoutDate"
  /admin/blackout-dates/{id}:
    delete:
      operationId: deleteBlackoutDate
      tags: [admin]
      summary: Remove a blackout date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/blackout-time-windows:
    get:
      operationId: adminListBlackoutTimeWindows
      tags: [admin]
      summary: List blackout time windows for a specific date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Blackout time windows for the date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlackoutTimeWindow"
        "400":
          description: Invalid or missing date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: adminCreateBlackoutTimeWindow
      tags: [admin]
      summary: Add a blackout time window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBlackoutTimeWindowBody"
      responses:
        "201":
          description: Created blackout time window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlackoutTimeWindow"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/blackout-time-windows/{id}:
    delete:
      operationId: adminDeleteBlackoutTimeWindow
      tags: [admin]
      summary: Remove a blackout time window
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /blackout-time-windows:
    get:
      operationId: listBlackoutTimeWindows
      tags: [events]
      summary: List blackout time windows for a specific date (public)
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Blackout time windows for the date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlackoutTimeWindow"
        "400":
          description: Invalid or missing date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/blackout-time-windows/dates-with-windows:
    get:
      operationId: adminListDatesWithTimeWindows
      tags: [admin]
      summary: List all dates that have at least one time window block
      responses:
        "200":
          description: Array of date strings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: date

  # Cart & Orders
  /cart:
    get:
      operationId: getCart
      tags: [orders]
      summary: Get current cart (by session)
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cart with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    post:
      operationId: addToCart
      tags: [orders]
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCartBody"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
  /cart/{itemId}:
    put:
      operationId: updateCartItem
      tags: [orders]
      summary: Update cart item quantity
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemBody"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    delete:
      operationId: removeFromCart
      tags: [orders]
      summary: Remove item from cart
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /plan:
    get:
      operationId: getPlan
      tags: [orders]
      summary: Get saved plan (wishlist)
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plan with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    post:
      operationId: addToPlan
      tags: [orders]
      summary: Add item to plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToPlanBody"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
  /plan/{itemId}:
    delete:
      operationId: removeFromPlan
      tags: [orders]
      summary: Remove item from plan
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"

  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order (checkout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /admin/orders:
    get:
      operationId: adminListOrders
      tags: [admin]
      summary: List all orders
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /admin/orders/{id}:
    put:
      operationId: updateOrderStatus
      tags: [admin]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # AI Chat
  /chat/message:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to the catering AI agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageBody"
      responses:
        "200":
          description: SSE stream of AI response
          content:
            text/event-stream: {}

  /chat/suggest-items:
    post:
      operationId: suggestMenuItems
      tags: [chat]
      summary: Get AI menu item suggestions based on event details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestItemsBody"
      responses:
        "200":
          description: Suggested menu items with quantities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestItemsResponse"

  # Admin stats
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get dashboard stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  # Idle activity (in-process counters; resets on server restart)
  /admin/idle-activity:
    get:
      operationId: getAdminIdleActivity
      tags: [admin]
      summary: Background traffic counters since the server last restarted
      responses:
        "200":
          description: Idle activity snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdleActivitySnapshot"

  # OpenAI conversations (generic, kept for compatibility)
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOpenaiConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOpenaiMessageBody"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /admin/printers:
    get:
      operationId: listPrinters
      tags: [printers]
      summary: List all configured printers
      responses:
        "200":
          description: List of printers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Printer"
    post:
      operationId: createPrinter
      tags: [printers]
      summary: Register a new CloudPRNT printer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrinterBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Printer"

  /admin/printers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updatePrinter
      tags: [printers]
      summary: Update a printer's configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePrinterBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Printer"
    delete:
      operationId: deletePrinter
      tags: [printers]
      summary: Delete a printer
      responses:
        "204":
          description: Deleted

  /admin/printers/{id}/test-print:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: testPrintPrinter
      tags: [printers]
      summary: Send a test print job to a printer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestPrintBody"
      responses:
        "200":
          description: Test job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintJob"

  /admin/print-jobs:
    get:
      operationId: listPrintJobs
      tags: [printers]
      summary: Recent print jobs (most recent first)
      parameters:
        - name: printerId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: List of recent print jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrintJob"

  /admin/print-jobs/{id}/retry:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: retryPrintJob
      tags: [printers]
      summary: Re-queue a failed print job
      responses:
        "200":
          description: Job re-queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintJob"

  /admin/sales-reports:
    get:
      operationId: getSalesReport
      tags: [admin]
      summary: Generate a unified sales report covering event orders and/or paid catering inquiries
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
            description: Start date (inclusive, local date string YYYY-MM-DD)
        - name: to
          in: query
          schema:
            type: string
            format: date
            description: End date (inclusive, local date string YYYY-MM-DD)
        - name: source
          in: query
          schema:
            type: string
            enum: [all, guest, staff]
            default: staff
        - name: status
          in: query
          schema:
            type: string
            enum: [all, completed]
            default: all
        - name: scope
          in: query
          schema:
            $ref: "#/components/schemas/SalesReportScope"
      responses:
        "200":
          description: Sales report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesReport"
        "401":
          description: Unauthorized

components:
  schemas:
    ClientPollsByFamily:
      type: array
      description: |
        Per-family HTTP request breakdown for one time window. Every known
        route family is always present (count may be zero). Families are
        sorted highest-count first. Endpoint keys are `:id`-normalized
        templates with the `/api` prefix stripped.
      items:
        type: object
        properties:
          family:
            type: string
          count:
            type: integer
          endpoints:
            type: array
            description: |
              Per-endpoint breakdown sorted by count descending. Hits to
              e.g. `/orders/47` and `/orders/48` aggregate into a single
              `/orders/:id` row. Capped per family; overflow rolls into a
