openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Catering Business API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: menu
    description: Menu item operations
  - name: orders
    description: Order and cart operations
  - name: events
    description: Event calendar and availability
  - name: chat
    description: AI chat agent operations
  - name: admin
    description: Admin dashboard operations
  - name: printers
    description: Network receipt printer management (LAN browser delivery via StarWebPRNT)
  - name: openai
    description: OpenAI AI chat, image, and audio operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Menu endpoints
  /menu:
    get:
      operationId: listMenuItems
      tags: [menu]
      summary: List all menu items
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: available
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
  /menu/{id}:
    get:
      operationId: getMenuItem
      tags: [menu]
      summary: Get a single menu item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Admin menu endpoints
  /admin/menu:
    get:
      operationId: adminListMenuItems
      tags: [admin]
      summary: List all menu items (admin)
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
    post:
      operationId: createMenuItem
      tags: [admin]
      summary: Create a new menu item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMenuItemBody"
      responses:
        "201":
          description: Created menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
  /admin/menu/{id}:
    put:
      operationId: updateMenuItem
      tags: [admin]
      summary: Update a menu item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMenuItemBody"
      responses:
        "200":
          description: Updated menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMenuItem
      tags: [admin]
      summary: Delete a menu item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/menu-items/generate-description:
    post:
      operationId: generateMenuItemDescription
      tags: [admin]
      summary: Generate an AI-written menu item description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDescriptionBody"
      responses:
        "200":
          description: Generated description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateDescriptionResponse"
        "400":
          description: Missing or invalid name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Event / Calendar endpoints
  /events/day-load:
    get:
      operationId: getDayLoad
      tags: [events]
      summary: Combined blackout + per-service-style + global guest-cap view for a single date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Day-load summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayLoadResponse"
        "400":
          description: Invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /events/availability:
    get:
      operationId: checkAvailability
      tags: [events]
      summary: Check availability for a date range
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Availability info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"

  /site-config:
    get:
      operationId: getSiteConfig
      tags: [events]
      summary: Public site configuration (hero image URL, etc.)
      responses:
        "200":
          description: Site config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteConfig"

  /admin/blackout-dates:
    get:
      operationId: listBlackoutDates
      tags: [admin]
      summary: List all blackout dates
      responses:
        "200":
          description: Blackout dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlackoutDate"
    post:
      operationId: createBlackoutDate
      tags: [admin]
      summary: Add a blackout date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBlackoutDateBody"
      responses:
        "201":
          description: Created blackout date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlackoutDate"
  /admin/blackout-dates/{id}:
    delete:
      operationId: deleteBlackoutDate
      tags: [admin]
      summary: Remove a blackout date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/blackout-time-windows:
    get:
      operationId: adminListBlackoutTimeWindows
      tags: [admin]
      summary: List blackout time windows for a specific date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Blackout time windows for the date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlackoutTimeWindow"
        "400":
          description: Invalid or missing date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: adminCreateBlackoutTimeWindow
      tags: [admin]
      summary: Add a blackout time window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBlackoutTimeWindowBody"
      responses:
        "201":
          description: Created blackout time window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlackoutTimeWindow"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/blackout-time-windows/{id}:
    delete:
      operationId: adminDeleteBlackoutTimeWindow
      tags: [admin]
      summary: Remove a blackout time window
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /blackout-time-windows:
    get:
      operationId: listBlackoutTimeWindows
      tags: [events]
      summary: List blackout time windows for a specific date (public)
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Blackout time windows for the date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlackoutTimeWindow"
        "400":
          description: Invalid or missing date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/blackout-time-windows/dates-with-windows:
    get:
      operationId: adminListDatesWithTimeWindows
      tags: [admin]
      summary: List all dates that have at least one time window block
      responses:
        "200":
          description: Array of date strings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: date

  # Event plan
  /plan:
    get:
      operationId: getPlan
      tags: [orders]
      summary: Get saved plan (wishlist)
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plan with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    post:
      operationId: addToPlan
      tags: [orders]
      summary: Add item to plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToPlanBody"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
  /plan/{itemId}:
    delete:
      operationId: removeFromPlan
      tags: [orders]
      summary: Remove item from plan
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"

  # OpenAI conversations (generic, kept for compatibility)
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOpenaiConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOpenaiMessageBody"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /admin/settings/print-template:
    get:
      operationId: getGlobalPrintTemplate
      tags: [printers]
      summary: Get the global print template from event_settings
      responses:
        "200":
          description: Global print template (null if not yet configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalPrintTemplateResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: patchGlobalPrintTemplate
      tags: [printers]
      summary: Save the global print template to event_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchGlobalPrintTemplateBody"
      responses:
        "200":
          description: Saved global print template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalPrintTemplateResponse"
        "400":
          description: Invalid template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/printers:
    get:
      operationId: listPrinters
      tags: [printers]
      summary: List all configured printers
      responses:
        "200":
          description: List of printers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Printer"
    post:
      operationId: createPrinter
      tags: [printers]
      summary: Register a new LAN printer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrinterBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Printer"

  /admin/printers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updatePrinter
      tags: [printers]
      summary: Update a printer's configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePrinterBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Printer"
    delete:
      operationId: deletePrinter
      tags: [printers]
      summary: Delete a printer
      responses:
        "204":
          description: Deleted

  /admin/printers/{id}/test-print:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: testPrintPrinter
      tags: [printers]
      summary: Send a test print job to a printer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestPrintBody"
      responses:
        "200":
          description: Test job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintJob"

  /admin/printers/{id}/test-lan:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: testLanPrinter
      tags: [printers]
      summary: Send a test ticket directly to the printer's LAN IP via TCP port 9100
      responses:
        "200":
          description: Ticket sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestLanResult"
        "400":
          description: No LAN IP configured
        "502":
          description: TCP connection failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /admin/printers/{id}/preview-template:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: previewPrinterTemplate
      tags: [printers]
      summary: Render a sample ticket with the given template and return stripped text for live preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewTemplateBody"
      responses:
        "200":
          description: Rendered preview text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewTemplateResult"
        "404":
          description: Printer not found

  /admin/print-jobs:
    get:
      operationId: listPrintJobs
      tags: [printers]
      summary: Recent print jobs (most recent first)
      parameters:
        - name: printerId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: List of recent print jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrintJob"

  /admin/print-jobs/{id}/retry:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: retryPrintJob
      tags: [printers]
      summary: Re-queue a failed print job
      responses:
        "200":
          description: Job re-queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintJob"

  /admin/square/terminal-devices:
    get:
      operationId: listSquareTerminalDevices
      tags: [admin]
      summary: List Square Terminal devices registered to the account
      responses:
        "200":
          description: List of Terminal devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SquareTerminalDevice"
        "424":
          description: Square is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Square API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/sales-reports:
    get:
      operationId: getSalesReport
      tags: [admin]
      summary: Generate a unified sales report covering event orders and/or paid catering inquiries
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
            description: Start date (inclusive, local date string YYYY-MM-DD)
        - name: to
          in: query
          schema:
            type: string
            format: date
            description: End date (inclusive, local date string YYYY-MM-DD)
        - name: source
          in: query
          schema:
            type: string
            enum: [all, guest, staff]
            default: staff
        - name: status
          in: query
          schema:
            type: string
            enum: [all, completed]
            default: all
        - name: scope
          in: query
          schema:
            $ref: "#/components/schemas/SalesReportScope"
      responses:
        "200":
          description: Sales report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesReport"
        "401":
          description: Unauthorized

  # Event Taker endpoints
  /event-taker/open-cash-drawer:
    post:
      operationId: openCashDrawer
      tags: [event-taker]
      summary: Manually open the cash drawer on all configured printers
      description: Enqueues a cash_drawer job for every enabled printer that has "Opens cash drawer" toggled on and a LAN IP. Silently does nothing if no such printer is configured. Requires taker password.
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  jobsEnqueued:
                    type: integer
                required: [ok, jobsEnqueued]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /event-taker/menu:
    get:
      operationId: getEventTakerMenu
      tags: [event-taker]
      summary: Get the staff event order taker menu with slot layout
      responses:
        "200":
          description: Taker menu items (ordered and filtered) plus the raw slot-layout array
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TakerMenuResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /event-taker/orders:
    post:
      operationId: createTakerOrder
      tags: [event-taker]
      summary: Submit an event order from the Staff Order Taker POS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTakerOrderBody"
      responses:
        "201":
          description: Created event order with snapshotted items and combo selections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TakerOrderResponse"
        "400":
          description: Validation error (missing guest name, invalid quantities, combo slot violations)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: Order taking paused or closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Print agent endpoints (browser + router shell agent)
  /print-agent/queued:
    get:
      operationId: listQueuedPrintAgentJobs
      tags: [printers]
      summary: List queued print jobs for the LAN/router agent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Queued jobs with pre-rendered ESC/POS bytes and StarWebPRNT XML
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    printerId:
                      type: integer
                    jobType:
                      type: string
                    lanIp:
                      type: string
                    webPrntXml:
                      type: string
                    rawBytesBase64:
                      type: string
                      description: Base64-encoded raw ESC/POS bytes for TCP port-9100 delivery
                    createdAt:
                      type: string
                      format: date-time
                  required: [id, printerId, jobType, lanIp, webPrntXml, rawBytesBase64, createdAt]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /print-agent/jobs/{id}/claim:
    post:
      operationId: claimPrintAgentJob
      tags: [printers]
      summary: Atomically claim a queued job for LAN delivery
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job claimed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintJob"
        "409":
          description: Job already claimed by another agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /print-agent/jobs/{id}/complete:
    post:
      operationId: completePrintAgentJob
      tags: [printers]
      summary: Mark a job as successfully printed by the LAN agent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                printerResponse:
                  type: string
      responses:
        "200":
          description: Job marked as printed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /print-agent/jobs/{id}/fail:
    post:
      operationId: failPrintAgentJob
      tags: [printers]
      summary: Report a delivery failure — requeues the job for retry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
      responses:
        "200":
          description: Job requeued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /print-agent/heartbeat:
    post:
      operationId: postPrintAgentHeartbeat
      tags: [printers]
      summary: Router agent liveness ping (public — token carried in body)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintAgentHeartbeatInput"
      responses:
        "200":
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getPrintAgentHeartbeat
      tags: [printers]
      summary: Get last-seen heartbeat for the calling admin token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Heartbeat status for this token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintAgentHeartbeatStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Cost Tracking ─────────────────────────────────────────────────────────

  /admin/costs/units:
    get:
      operationId: listCostUnits
      tags: [admin]
      summary: List canonical units grouped by measurement family
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Grouped unit list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnitGroup"

  /admin/costs/ingredients:
    get:
      operationId: listIngredients
      tags: [admin]
      summary: List all ingredients with current cost and history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of ingredients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngredientWithCost"
    post:
      operationId: createIngredient
      tags: [admin]
      summary: Create an ingredient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIngredientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientWithCost"

  /admin/costs/ingredients/{id}:
    put:
      operationId: updateIngredient
      tags: [admin]
      summary: Update ingredient name/unit/notes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIngredientInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientWithCost"
        "404":
          description: Not found
    delete:
      operationId: deleteIngredient
      tags: [admin]
      summary: Delete an ingredient (blocked if used in recipes)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Ingredient is used in a recipe

  /admin/costs/ingredients/{id}/costs:
    post:
      operationId: addIngredientCost
      tags: [admin]
      summary: Record a new cost entry for an ingredient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddIngredientCostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientCostEntry"
        "404":
          description: Ingredient not found

  /admin/menu/{itemId}/recipe:
    get:
      operationId: getMenuItemRecipe
      tags: [admin]
      summary: Get the recipe for a menu item
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recipe or null if not defined
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: "#/components/schemas/RecipeDetail"
        "404":
          description: Menu item not found
    put:
      operationId: saveMenuItemRecipe
      tags: [admin]
      summary: Create or replace the recipe for a menu item
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveRecipeInput"
      responses:
        "200":
          description: Saved recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
        "404":
          description: Menu item not found
    delete:
      operationId: deleteMenuItemRecipe
      tags: [admin]
      summary: Delete the recipe for a menu item
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /admin/costs/labor:
    get:
      operationId: listLaborEntries
      tags: [admin]
      summary: List labor entries for an event session or catering inquiry
      security:
        - bearerAuth: []
      parameters:
        - name: referenceType
          in: query
          required: true
          schema:
            type: string
            enum: [event_session, catering_inquiry]
        - name: referenceId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Labor entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LaborEntry"
    post:
      operationId: createLaborEntry
      tags: [admin]
      summary: Add a labor entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLaborInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaborEntry"

  /admin/costs/labor/{id}:
    patch:
      operationId: updateLaborEntry
      tags: [admin]
      summary: Update a labor entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLaborInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaborEntry"
        "404":
          description: Not found
    delete:
      operationId: deleteLaborEntry
      tags: [admin]
      summary: Delete a labor entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /admin/costs/preparations:
    get:
      operationId: listPreparations
      tags: [admin]
      summary: List all preparations with cost per yield unit
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of preparations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PreparationItem"
    post:
      operationId: createPreparation
      tags: [admin]
      summary: Create a new preparation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePreparationInput"
      responses:
        "201":
          description: Created preparation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparationDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/costs/preparations/{id}:
    get:
      operationId: getPreparation
      tags: [admin]
      summary: Get a single preparation with lines and cost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Preparation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparationDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updatePreparation
      tags: [admin]
      summary: Update a preparation (replaces all lines when provided)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePreparationInput"
      responses:
        "200":
          description: Updated preparation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparationDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePreparation
      tags: [admin]
      summary: Delete a preparation (fails if referenced by recipes)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: In use by one or more recipes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/costs/summary:
    get:
      operationId: getCostSummary
      tags: [admin]
      summary: Get cost summary (COGS + labor + profit) for a date range
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
            enum: [events, catering, all]
      responses:
        "200":
          description: Cost summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostSummary"

  /admin/event-settings/hero-image:
    patch:
      operationId: updateHeroImage
      tags: [admin]
      summary: Set or clear the home page hero image URL
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHeroImageBody"
      responses:
        "200":
          description: Hero image updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateHeroImageResponse"

  /admin/images/upload-hero:
    post:
      operationId: uploadHeroImage
      tags: [admin]
      summary: Upload and process a hero image (resized to 1920×1080 JPEG)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required: [image]
      responses:
        "200":
          description: Processed hero image URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadHeroImageResponse"

  # Offline payments on catering inquiries
  /admin/catering/{id}/offline-payments:
    post:
      operationId: adminAddCateringOfflinePayment
      tags: [admin]
      summary: Record an offline payment (check, cash, wire, other) against a catering inquiry
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Catering inquiry ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOfflinePaymentBody"
      responses:
        "200":
          description: Updated inquiry with computedBalance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflinePaymentResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Inquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/catering/{id}/offline-payments/{paymentId}:
    delete:
      operationId: adminDeleteCateringOfflinePayment
      tags: [admin]
      summary: Remove an offline payment from a catering inquiry
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Catering inquiry ID
        - in: path
          name: paymentId
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the offline payment to remove
      responses:
        "200":
          description: Updated inquiry with computedBalance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflinePaymentResponse"
        "404":
          description: Inquiry or payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    SquareTerminalDevice:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        model:
          type: string
      required: [id, name, model]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SalesReportScope:
      type: string
      enum: [events, catering, all]
      description: >
        Which order types to include.
        "events" = on-site event orders only;
        "catering" = paid catering inquiries only;
        "all" = both combined.

    SalesReportItem:
      type: object
      properties:
        name:
          type: string
        quantity:
          type: integer
        revenue:
          type: number
        components:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              quantity:
                type: integer
            required: [name, quantity]
      required: [name, quantity, revenue]

    SalesReportOrderLine:
      type: object
      properties:
        itemId:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        lineTotal:
          type: number
      required: [itemId, name, quantity, unitPrice, lineTotal]

    SalesReportOrder:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [event]
          description: Discriminant tag identifying this as an on-site event order.
        createdAt:
          type: string
          format: date-time
        source:
          type: string
        guestName:
          type: string
        phoneNumber:
          type: string
          nullable: true
        status:
          type: string
        paymentMethod:
          type: string
          enum: [cash, card, venmo, override, other]
        items:
          type: array
          items:
            $ref: "#/components/schemas/SalesReportOrderLine"
        subtotal:
          type: number
        taxRate:
          type: number
          nullable: true
        tax:
          type: number
        total:
          type: number
        readyAt:
          type: string
          format: date-time
          nullable: true
        pickedUpAt:
          type: string
          format: date-time
          nullable: true
        timeToReadySec:
          type: integer
          nullable: true
        timeReadyToPickupSec:
          type: integer
          nullable: true
        timeToPickupSec:
          type: integer
          nullable: true
        voided:
          type: boolean
        voidedAt:
          type: string
          format: date-time
          nullable: true
        voidedBy:
          type: string
          nullable: true
        voidReason:
          type: string
          nullable: true
        refundRequired:
          type: boolean
      required:
        - id
        - type
        - createdAt
        - source
        - guestName
        - status
        - paymentMethod
        - items
        - subtotal
        - tax
        - total
        - voided
        - refundRequired

    SalesReportVoidRow:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        voidedAt:
          type: string
          format: date-time
        voidedBy:
          type: string
          nullable: true
        voidReason:
          type: string
          nullable: true
        guestName:
          type: string
        source:
          type: string
        paymentMethod:
          type: string
          enum: [cash, card, venmo, override, other]
        total:
          type: number
        refundRequired:
          type: boolean
      required:
        - id
        - createdAt
        - voidedAt
        - guestName
        - source
        - paymentMethod
        - total
        - refundRequired

    SalesReportVoids:
      type: object
      properties:
        count:
          type: integer
        totalAmount:
          type: number
        refundOwedAmount:
          type: number
        list:
          type: array
          items:
            $ref: "#/components/schemas/SalesReportVoidRow"
      required: [count, totalAmount, refundOwedAmount, list]

    SalesReportPaymentMethodTotal:
      type: object
      properties:
        method:
          type: string
          enum: [cash, card, venmo, override, other]
        orderCount:
          type: integer
        revenue:
          type: number
      required: [method, orderCount, revenue]

    SalesReportPickupStats:
      type: object
      properties:
        pickedUpCount:
          type: integer
        avgPickupSec:
          type: number
          nullable: true
        medianPickupSec:
          type: number
          nullable: true
        prepCount:
          type: integer
        avgPrepSec:
          type: number
          nullable: true
        medianPrepSec:
          type: number
          nullable: true
        readyToPickupCount:
          type: integer
        avgReadyToPickupSec:
          type: number
          nullable: true
        medianReadyToPickupSec:
          type: number
          nullable: true
      required:
        - pickedUpCount
        - prepCount
        - readyToPickupCount

    SalesReportTotals:
      type: object
      properties:
        orderCount:
          type: integer
        itemCount:
          type: integer
        subtotal:
          type: number
        tax:
          type: number
        revenue:
          type: number
        avgOrderValue:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/SalesReportItem"
        orders:
          type: array
          items:
            $ref: "#/components/schemas/SalesReportOrder"
        byPaymentMethod:
          type: array
          items:
            $ref: "#/components/schemas/SalesReportPaymentMethodTotal"
        pickupStats:
          $ref: "#/components/schemas/SalesReportPickupStats"
        voids:
          $ref: "#/components/schemas/SalesReportVoids"
      required:
        - orderCount
        - itemCount
        - subtotal
        - tax
        - revenue
        - avgOrderValue
        - items
        - orders
        - byPaymentMethod
        - pickupStats
        - voids

    CateringReportItem:
      type: object
      properties:
        name:
          type: string
        quantity:
          type: integer
        revenue:
          type: number
      required: [name, quantity, revenue]

    CateringReportOrder:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [catering]
        clientName:
          type: string
        eventDate:
          type: string
          nullable: true
        eventTime:
          type: string
          nullable: true
          description: Delivery time in HH:MM 24-hour format.
        createdAt:
          type: string
          format: date-time
        status:
          type: string
        squareInvoiceStatus:
          type: string
          nullable: true
        squareAmountPaid:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/CateringReportItem"
      required:
        - id
        - type
        - clientName
        - createdAt
        - status
        - squareAmountPaid
        - items

    CateringReportTotals:
      type: object
      properties:
        orderCount:
          type: integer
        itemCount:
          type: integer
        revenue:
          type: number
        avgOrderValue:
          type: number
        orders:
          type: array
          items:
            $ref: "#/components/schemas/CateringReportOrder"
        items:
          type: array
          items:
            $ref: "#/components/schemas/CateringReportItem"
      required:
        - orderCount
        - itemCount
        - revenue
        - avgOrderValue
        - orders
        - items

    SalesReport:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        source:
          type: string
          enum: [all, guest, staff]
        scope:
          $ref: "#/components/schemas/SalesReportScope"
        status:
          type: string
          enum: [all, completed]
        totals:
          $ref: "#/components/schemas/SalesReportTotals"
        bySource:
          type: object
          properties:
            guest:
              $ref: "#/components/schemas/SalesReportTotals"
            staff:
              $ref: "#/components/schemas/SalesReportTotals"
          required: [guest, staff]
        catering:
          oneOf:
            - $ref: "#/components/schemas/CateringReportTotals"
            - type: "null"
        byType:
          type: object
          description: >
            Explicit per-type breakdowns plus a combined order list.
            Use allOrders to render a unified chronological table — items are
            tagged with type="event" or type="catering" for row-level branching.
          properties:
            events:
              $ref: "#/components/schemas/SalesReportTotals"
            catering:
              oneOf:
                - $ref: "#/components/schemas/CateringReportTotals"
                - type: "null"
            allOrders:
              type: array
              description: >
                Combined and chronologically-sorted list of event orders (type="event")
                and catering orders (type="catering"). Discriminate on the type field.
              items:
                oneOf:
                  - $ref: "#/components/schemas/SalesReportOrder"
                  - $ref: "#/components/schemas/CateringReportOrder"
                discriminator:
                  propertyName: type
                  mapping:
                    event: "#/components/schemas/SalesReportOrder"
                    catering: "#/components/schemas/CateringReportOrder"
          required: [events, catering, allOrders]
      required:
        - from
        - to
        - source
        - scope
        - totals
        - bySource
        - byType

    GenerateDescriptionBody:
      type: object
      properties:
        name:
          type: string
          description: The menu item name to generate a description for
        existingSamples:
          type: array
          items:
            type: string
          description: Optional style-example strings. If omitted the server fetches samples from the database.
      required:
        - name

    GenerateDescriptionResponse:
      type: object
      properties:
        description:
          type: string
      required:
        - description

    ErrorResponse:
      type: object
      properties:
