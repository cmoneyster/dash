          type: integer
          description: Minimum quantity required to add this item to an order
          default: 1
        tier2Qty:
          type: integer
          nullable: true
          description: Minimum quantity to unlock tier 2 pricing
        tier2Price:
          type: number
          nullable: true
          description: Price per unit at tier 2
        tier3Qty:
          type: integer
          nullable: true
          description: Minimum quantity to unlock tier 3 pricing
        tier3Price:
          type: number
          nullable: true
          description: Price per unit at tier 3
        eventActive:
          type: boolean
          description: Whether this item is shown on the on-site event ordering page (guest-facing /event)
        eventTakerVisible:
          type: boolean
          description: Whether this item is shown on the staff Event Order Taker page (/event-taker)
        eventTakerPrice:
          type: number
          nullable: true
          description: Separate per-unit price for the staff Event Order Taker page (`/event-taker`). Strict — items with this null are hidden from the order taker (no fallback to `price`).
        eventStock:
          type: integer
          nullable: true
          description: Optional inventory cap for event ordering. Decremented on each event/POS order; null means unlimited.
        otdEligible:
          type: boolean
          description: Whether this item can be cooked fresh on-site as part of the "On the Dash Experience" food trailer service. Drop-off-only items default to false.
        labelPrintingEnabled:
          type: boolean
          description: When false, no item labels are enqueued for this item regardless of label policy or box size. Defaults to true.
        labelPolicy:
          type: string
          enum: [per_unit, combined, per_box]
          description: How many physical item labels to print per quantity ordered.
        labelBoxSize:
          type: integer
          nullable: true
          description: Box pack size for the per_box label policy. Order qty 14 with box 6 → 3 labels (6, 6, 2).
        effectivePrice:
          type: number
          description: Resolved selling price for this context (e.g. eventTakerPrice on the POS). Only present on taker-menu responses.
          nullable: true
        internalNotes:
          type: string
          nullable: true
          description: Internal kitchen/staff notes not shown to customers.
        createdAt:
          type: string
          format: date-time
        isCombo:
          type: boolean
          description: Whether this item is a combo that requires slot selection before ordering.
        comboSlots:
          type: array
          nullable: true
          description: Ordered slot definitions for combo items.
          items:
            $ref: "#/components/schemas/ComboSlot"
        comboComponentLabels:
          type: boolean
          description: Whether to also print individual component labels for each combo component.
        sourceItemId:
          type: integer
          nullable: true
          description: When set, this item inherits its recipe from the referenced menu item (one level only). Cleared automatically when the item saves its own recipe.
      required:
