    IdleActivitySnapshot:
      type: object
      properties:
        serverStartedAt:
          type: string
          format: date-time
        asOf:
          type: string
          format: date-time
        ejoinPolls:
          type: object
          properties:
            lastHour:
              type: object
              properties:
                count:
                  type: integer
                bytes:
                  type: integer
                avgBytesPerPoll:
                  type: ["integer", "null"]
                  description: >-
                    Average response-body bytes per ejoin poll inside the
                    window. `null` when no polls were recorded.
              required: [count, bytes, avgBytesPerPoll]
            last24h:
              type: object
              properties:
                count:
                  type: integer
                bytes:
                  type: integer
                avgBytesPerPoll:
                  type: ["integer", "null"]
                  description: >-
                    Average response-body bytes per ejoin poll inside the
                    window. `null` when no polls were recorded.
              required: [count, bytes, avgBytesPerPoll]
          required: [lastHour, last24h]
        outboundSms:
          type: object
          properties:
            lastHour:
              type: integer
            last24h:
              type: integer
          required: [lastHour, last24h]
        instagramPolls:
          type: object
          properties:
            last24h:
              type: integer
            lastRunAt:
              type: ["string", "null"]
              format: date-time
          required: [last24h, lastRunAt]
        clientPolls:
          type: object
          properties:
            windowMinutes:
              type: integer
            byFamily:
              type: array
              items:
                type: object
                properties:
                  family:
                    type: string
                  count:
                    type: integer
                  endpoints:
                    type: array
                    description: |
                      Per-endpoint breakdown of the requests counted toward
                      this family in the snapshot window. Sorted by count
                      descending, with `:id`-style segments normalized so
                      hits to e.g. `/orders/47` and `/orders/48` aggregate
                      into a single `/orders/:id` row. Capped per family;
                      anything beyond the cap rolls into a synthetic
                      `(other)` entry.
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        count:
                          type: integer
                      required: [path, count]
                required: [family, count, endpoints]
          required: [windowMinutes, byFamily]
        smsPoller:
          type: object
          properties:
            enabled:
              type: boolean
            intervalSeconds:
              type: integer
            inboundMode:
              type: string
              enum: [push, poll]
          required: [enabled, intervalSeconds, inboundMode]
        instagramPoller:
          type: object
          properties:
            enabled:
              type: boolean
            intervalMinutes:
              type: integer
          required: [enabled, intervalMinutes]
      required:
        - serverStartedAt
        - asOf
        - ejoinPolls
        - outboundSms
        - instagramPolls
        - clientPolls
        - smsPoller
        - instagramPoller

