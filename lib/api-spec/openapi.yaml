          type: string
          description: The base URL the agent is configured to poll

    PrintAgentHeartbeatStatus:
      type: object
      required: [lastSeenAt, serverUrl]
      properties:
        lastSeenAt:
          type: ["string", "null"]
          format: date-time
          description: ISO timestamp of the most recent heartbeat, or null if never seen
        serverUrl:
          type: ["string", "null"]
          description: The serverUrl reported by the agent in its last ping

    # ── Cost Tracking ──────────────────────────────────────────────────────────

    IngredientCostEntry:
      type: object
      required: [id, costPerUnit, effectiveAt]
      properties:
        id:
          type: integer
        costPerUnit:
          type: number
        effectiveAt:
          type: string
          format: date-time

    IngredientWithCost:
      type: object
      required: [id, name, unit, createdAt, history]
      properties:
        id:
          type: integer
        name:
          type: string
        unit:
          type: string
        notes:
          type: string
          nullable: true
        currentCost:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
        history:
          type: array
          items:
            $ref: "#/components/schemas/IngredientCostEntry"

    CreateIngredientInput:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
        unit:
          type: string
        notes:
          type: string
          nullable: true
        initialCost:
          type: number
          nullable: true

    UpdateIngredientInput:
      type: object
      properties:
        name:
          type: string
        unit:
          type: string
        notes:
          type: string
          nullable: true

    AddIngredientCostInput:
      type: object
      required: [costPerUnit]
      properties:
        costPerUnit:
          type: number
        effectiveAt:
          type: string
          format: date-time
          nullable: true

    RecipeLine:
      type: object
      required: [id, kind, quantityPerYield]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [ingredient, preparation]
          description: >
            "ingredient" for raw ingredient lines; "preparation" for preparation lines.
        ingredientId:
          type: integer
          description: Present only when kind = "ingredient".
        ingredientName:
          type: string
          description: Present only when kind = "ingredient".
        ingredientUnit:
          type: string
          description: Present only when kind = "ingredient".
        preparationId:
          type: integer
          description: Present only when kind = "preparation".
        preparationName:
          type: string
          description: Present only when kind = "preparation".
        preparationYieldUnit:
          type: string
          description: The yield unit of the preparation (e.g. "g"). Present only when kind = "preparation".
        quantityPerYield:
          type: number
        recipeUnit:
          type: string
          nullable: true
        conversionError:
          type: boolean
          nullable: true
          description: >
            True when recipeUnit and ingredientUnit are both canonical units
            but belong to different measurement families (e.g. oz vs cup).
            This line is excluded from cost calculations. Null/false otherwise.
        costContribution:
          type: number
          nullable: true
          description: >
            Estimated cost contribution of this line using the most recent ingredient
            or sub-recipe cost. Null when costs are unavailable or a unit mismatch exists.

    PanSizeCost:
      type: object
      required: [label, servings, costPerPan]
      properties:
        label:
          type: string
        servings:
          type: integer
        costPerPan:
          type: number

    PreparationItem:
      type: object
      required: [id, name, yieldServings, yieldUnit]
      properties:
        id:
          type: integer
        name:
          type: string
        yieldServings:
          type: integer
        yieldUnit:
          type: string
          description: The unit this preparation yields (e.g. "g", "ml").
        notes:
          type: string
          nullable: true
        costPerYieldUnit:
          type: number
          nullable: true
          description: Cost per one unit of yieldUnit. Null if costs are incomplete.

    PreparationLine:
      type: object
      required: [id, ingredientId, ingredientName, ingredientUnit, quantityPerYield]
      properties:
        id:
          type: integer
        ingredientId:
          type: integer
        ingredientName:
          type: string
        ingredientUnit:
          type: string
        quantityPerYield:
          type: number
        recipeUnit:
          type: string
          nullable: true
        conversionError:
          type: boolean
          nullable: true
        costContribution:
          type: number
          nullable: true

    PreparationDetail:
      type: object
      required: [id, name, yieldServings, yieldUnit, lines, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        yieldServings:
          type: integer
        yieldUnit:
          type: string
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PreparationLine"
        costPerYieldUnit:
          type: number
          nullable: true

    SavePreparationInput:
      type: object
      required: [name, yieldUnit]
      properties:
        name:
          type: string
        yieldServings:
          type: integer
        yieldUnit:
          type: string
        notes:
          type: string
          nullable: true
        lines:
          type: array
          items:
            type: object
            required: [ingredientId, quantityPerYield]
            properties:
              ingredientId:
                type: integer
              quantityPerYield:
                type: number
              recipeUnit:
                type: string
                nullable: true

    RecipeDetail:
      type: object
      required: [id, menuItemId, yieldServings, lines, isInherited]
      properties:
        id:
          type: integer
        menuItemId:
          type: integer
        yieldServings:
          type: integer
        notes:
          type: string
          nullable: true
        lines:
          type: array
          items:
            $ref: "#/components/schemas/RecipeLine"
        costPerServing:
          type: number
          nullable: true
        costPerUnit:
          type: number
          nullable: true
        missingCosts:
          type: integer
        panSizeCosts:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/PanSizeCost"
        isInherited:
          type: boolean
          description: True when this recipe is sourced from another item via sourceItemId (read-only, cannot be edited here).
        inheritedFrom:
          type: object
          nullable: true
          description: Source item details when isInherited is true.
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string

    SaveRecipeInput:
      type: object
      required: [lines]
      properties:
        yieldServings:
          type: integer
        notes:
          type: string
          nullable: true
        lines:
          type: array
          items:
            type: object
            required: [quantityPerYield]
            properties:
              ingredientId:
                type: integer
                nullable: true
                description: Required for ingredient lines. Mutually exclusive with preparationId.
              preparationId:
                type: integer
                nullable: true
                description: Required for preparation lines. Mutually exclusive with ingredientId.
              quantityPerYield:
                type: number
              recipeUnit:
                type: string
                nullable: true

    UnitDef:
      type: object
      required: [symbol, label, family, toBase]
      properties:
        symbol:
          type: string
        label:
          type: string
        family:
          type: string
          enum: [weight, volume, count]
        toBase:
          type: number

    UnitGroup:
      type: object
      required: [family, units]
      properties:
        family:
          type: string
        units:
          type: array
          items:
            $ref: "#/components/schemas/UnitDef"

    LaborEntry:
      type: object
      required: [id, referenceType, referenceId, employeeName, createdAt]
      properties:
        id:
          type: integer
        referenceType:
          type: string
        referenceId:
          type: integer
        employeeName:
          type: string
        hours:
          type: number
          nullable: true
        hourlyRate:
          type: number
          nullable: true
        flatCost:
          type: number
          nullable: true
        subtotal:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateLaborInput:
      type: object
      required: [referenceType, referenceId, employeeName]
      properties:
        referenceType:
          type: string
          enum: [event_session, catering_inquiry]
        referenceId:
          type: integer
        employeeName:
          type: string
        hours:
          type: number
          nullable: true
        hourlyRate:
          type: number
          nullable: true
        flatCost:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true

    UpdateLaborInput:
      type: object
      properties:
        employeeName:
          type: string
        hours:
          type: number
          nullable: true
        hourlyRate:
          type: number
          nullable: true
        flatCost:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true

    CostSummaryItemBreakdownComponent:
      type: object
      required: [name, quantity, cogs]
      properties:
        name:
          type: string
        quantity:
          type: integer
        cogs:
          type: number

    CostSummaryItemBreakdown:
      type: object
      required: [name, quantity, cogs, revenue]
      properties:
        name:
          type: string
        quantity:
          type: integer
        cogs:
          type: number
        revenue:
          type: number
        margin:
          type: number
          nullable: true
        components:
          type: array
          description: Present when the item is a combo — lists each selected component with its quantity and COGS contribution.
          items:
            $ref: "#/components/schemas/CostSummaryItemBreakdownComponent"

    CostSummaryLaborBreakdown:
      type: object
      required: [referenceType, referenceId, name, laborCost]
      properties:
        referenceType:
          type: string
        referenceId:
          type: integer
        name:
          type: string
        laborCost:
          type: number

    CostSummary:
      type: object
      required: [from, to, scope, revenue, cogs, laborCost, grossProfit, itemsWithRecipe, itemsWithoutRecipe, isEstimated, itemBreakdown, laborBreakdown]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        scope:
          type: string
        revenue:
          type: number
        cogs:
          type: number
        laborCost:
          type: number
        grossProfit:
          type: number
        grossMargin:
          type: number
          nullable: true
        itemsWithRecipe:
          type: integer
        itemsWithoutRecipe:
          type: integer
        isEstimated:
          type: boolean
          description: True when any ingredient cost was resolved via latest-cost fallback because no price existed at or before the order date. Figures are approximate.
        itemBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CostSummaryItemBreakdown"
        laborBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CostSummaryLaborBreakdown"

    SiteConfig:
      type: object
      required: [heroImageUrl]
      properties:
        heroImageUrl:
          type: string
          nullable: true
          description: URL of the custom home page hero image, or null if using the default.

    UpdateHeroImageBody:
      type: object
      properties:
        heroImageUrl:
          type: string
          nullable: true
          description: New hero image URL, or null to reset to default.

    UpdateHeroImageResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    UploadHeroImageResponse:
      type: object
      required: [servingUrl]
      properties:
        servingUrl:
          type: string
          description: Serving URL of the processed 1920×1080 hero image.
    OfflinePayment:
      type: object
      description: A single offline payment (check, cash, wire, or other) recorded on a catering inquiry.
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
          format: float
          minimum: 0.01
        method:
          type: string
          enum: [check, cash, wire, other]
        date:
          type: string
          format: date
          description: Date the payment was received (YYYY-MM-DD)
        note:
          type: string
          nullable: true
      required: [id, amount, method, date]

    CateringComputedBalance:
      type: object
      description: |
        Authoritative balance computed server-side for the inquiry.
        If a Square invoice exists: remaining = squareBalanceDue − offlinePaid
        Otherwise: remaining = quoteTotal − offlinePaid
      properties:
        invoiceTotal:
          type: number
          format: float
          description: squareAmountPaid + squareBalanceDue (0 when no invoice)
        squarePaid:
          type: number
          format: float
        offlinePaid:
          type: number
          format: float
          description: Sum of all offline payment amounts
        remaining:
          type: number
          format: float
          description: Outstanding balance after Square paid + offline paid
      required: [invoiceTotal, squarePaid, offlinePaid, remaining]

    ServiceStyleKey:
      type: string
      enum: [drop_off, on_the_dash, buffet, grazing, made_to_order, unknown]
