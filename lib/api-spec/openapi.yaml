      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        source:
          type: string
          enum: [all, guest, staff]
        scope:
          $ref: "#/components/schemas/SalesReportScope"
        status:
          type: string
          enum: [all, completed]
        totals:
          $ref: "#/components/schemas/SalesReportTotals"
        bySource:
          type: object
          properties:
            guest:
              $ref: "#/components/schemas/SalesReportTotals"
            staff:
              $ref: "#/components/schemas/SalesReportTotals"
          required: [guest, staff]
        catering:
          oneOf:
            - $ref: "#/components/schemas/CateringReportTotals"
            - type: "null"
        byType:
          type: object
          description: >
            Explicit per-type breakdowns plus a combined order list.
            Use allOrders to render a unified chronological table — items are
            tagged with type="event" or type="catering" for row-level branching.
          properties:
            events:
              $ref: "#/components/schemas/SalesReportTotals"
            catering:
              oneOf:
                - $ref: "#/components/schemas/CateringReportTotals"
                - type: "null"
            allOrders:
              type: array
              description: >
                Combined and chronologically-sorted list of event orders (type="event")
                and catering orders (type="catering"). Discriminate on the type field.
              items:
                oneOf:
                  - $ref: "#/components/schemas/SalesReportOrder"
                  - $ref: "#/components/schemas/CateringReportOrder"
                discriminator:
                  propertyName: type
                  mapping:
                    event: "#/components/schemas/SalesReportOrder"
                    catering: "#/components/schemas/CateringReportOrder"
          required: [events, catering, allOrders]
