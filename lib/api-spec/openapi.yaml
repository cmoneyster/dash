    IdleActivitySnapshot:
      type: object
      properties:
        serverStartedAt:
          type: string
          format: date-time
        asOf:
          type: string
          format: date-time
        ejoinPolls:
          type: object
          properties:
            lastHour:
              type: object
              properties:
                count:
                  type: integer
                bytes:
                  type: integer
                avgBytesPerPoll:
                  type: ["integer", "null"]
                  description: >-
                    Average response-body bytes per ejoin poll inside the
                    window. `null` when no polls were recorded.
              required: [count, bytes, avgBytesPerPoll]
            last24h:
              type: object
              properties:
                count:
                  type: integer
                bytes:
                  type: integer
                avgBytesPerPoll:
                  type: ["integer", "null"]
                  description: >-
                    Average response-body bytes per ejoin poll inside the
                    window. `null` when no polls were recorded.
              required: [count, bytes, avgBytesPerPoll]
          required: [lastHour, last24h]
        outboundSms:
          type: object
          properties:
            lastHour:
              type: integer
            last24h:
              type: integer
          required: [lastHour, last24h]
        instagramPolls:
          type: object
          properties:
            last24h:
              type: integer
            lastRunAt:
              type: ["string", "null"]
              format: date-time
          required: [last24h, lastRunAt]
        clientPolls:
          type: object
          description: |
            Three parallel time-window breakdowns of inbound HTTP requests
            grouped by route family. All three windows are computed in a
            single snapshot so the UI can switch between them without an
            extra round-trip. Each window is an array of per-family objects
            with the same shape.
          properties:
            last5min:
              $ref: '#/components/schemas/ClientPollsByFamily'
            lastHour:
              $ref: '#/components/schemas/ClientPollsByFamily'
            last24h:
              $ref: '#/components/schemas/ClientPollsByFamily'
          required: [last5min, lastHour, last24h]
        smsPoller:
          type: object
          properties:
            enabled:
              type: boolean
            intervalSeconds:
              type: integer
            inboundMode:
              type: string
              enum: [push, poll]
          required: [enabled, intervalSeconds, inboundMode]
        instagramPoller:
          type: object
          properties:
            enabled:
              type: boolean
            intervalMinutes:
              type: integer
          required: [enabled, intervalMinutes]
      required:
        - serverStartedAt
        - asOf
        - ejoinPolls
        - outboundSms
        - instagramPolls
        - clientPolls
        - smsPoller
        - instagramPoller

