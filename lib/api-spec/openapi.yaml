openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Catering Business API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: menu
    description: Menu item operations
  - name: orders
    description: Order and cart operations
  - name: events
    description: Event calendar and availability
  - name: chat
    description: AI chat agent operations
  - name: admin
    description: Admin dashboard operations
  - name: openai
    description: OpenAI AI chat, image, and audio operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Menu endpoints
  /menu:
    get:
      operationId: listMenuItems
      tags: [menu]
      summary: List all menu items
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: available
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
  /menu/{id}:
    get:
      operationId: getMenuItem
      tags: [menu]
      summary: Get a single menu item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Admin menu endpoints
  /admin/menu:
    get:
      operationId: adminListMenuItems
      tags: [admin]
      summary: List all menu items (admin)
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
    post:
      operationId: createMenuItem
      tags: [admin]
      summary: Create a new menu item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMenuItemBody"
      responses:
        "201":
          description: Created menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
  /admin/menu/{id}:
    put:
      operationId: updateMenuItem
      tags: [admin]
      summary: Update a menu item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMenuItemBody"
      responses:
        "200":
          description: Updated menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMenuItem
      tags: [admin]
      summary: Delete a menu item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Event / Calendar endpoints
  /events/availability:
    get:
      operationId: checkAvailability
      tags: [events]
      summary: Check availability for a date range
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Availability info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"

  # Admin chat-bot recommended items
  /admin/recommendations:
    get:
      operationId: adminListRecommendations
      tags: [admin]
      summary: List curated chat-bot recommendations
      responses:
        "200":
          description: Recommended items in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecommendedItem"
    post:
      operationId: adminAddRecommendation
      tags: [admin]
      summary: Add a menu item to the recommendations list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRecommendationBody"
      responses:
        "201":
          description: Updated recommendations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecommendedItem"
        "404":
          description: Menu item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Item already in the recommendations list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/recommendations/{menuItemId}:
    delete:
      operationId: adminRemoveRecommendation
      tags: [admin]
      summary: Remove a menu item from the recommendations list
      parameters:
        - name: menuItemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
  /admin/recommendations/reorder:
    patch:
      operationId: adminReorderRecommendations
      tags: [admin]
      summary: Reorder the recommendations list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRecommendationsBody"
      responses:
        "200":
          description: Updated recommendations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecommendedItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/recommendations/top-sellers:
    get:
      operationId: adminListTopSellers
      tags: [admin]
      summary: Compute top-selling menu items from real order data
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Top sellers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopSeller"
  /admin/recommendations/sync:
    post:
      operationId: adminSyncRecommendations
      tags: [admin]
      summary: Apply top sellers to the recommendations list (replace or merge)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRecommendationsBody"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRecommendationsResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/blackout-dates:
    get:
      operationId: listBlackoutDates
      tags: [admin]
      summary: List all blackout dates
      responses:
        "200":
          description: Blackout dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlackoutDate"
    post:
      operationId: createBlackoutDate
      tags: [admin]
      summary: Add a blackout date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBlackoutDateBody"
      responses:
        "201":
          description: Created blackout date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlackoutDate"
  /admin/blackout-dates/{id}:
    delete:
      operationId: deleteBlackoutDate
      tags: [admin]
      summary: Remove a blackout date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Cart & Orders
  /cart:
    get:
      operationId: getCart
      tags: [orders]
      summary: Get current cart (by session)
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cart with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    post:
      operationId: addToCart
      tags: [orders]
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCartBody"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
  /cart/{itemId}:
    put:
      operationId: updateCartItem
      tags: [orders]
      summary: Update cart item quantity
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemBody"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    delete:
      operationId: removeFromCart
      tags: [orders]
      summary: Remove item from cart
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /plan:
    get:
      operationId: getPlan
      tags: [orders]
      summary: Get saved plan (wishlist)
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plan with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    post:
      operationId: addToPlan
      tags: [orders]
      summary: Add item to plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToPlanBody"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
  /plan/{itemId}:
    delete:
      operationId: removeFromPlan
      tags: [orders]
      summary: Remove item from plan
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"

  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order (checkout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /admin/orders:
    get:
      operationId: adminListOrders
      tags: [admin]
      summary: List all orders
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /admin/orders/{id}:
    put:
      operationId: updateOrderStatus
      tags: [admin]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # AI Chat
  /chat/message:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to the catering AI agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageBody"
      responses:
        "200":
          description: SSE stream of AI response
          content:
            text/event-stream: {}

  /chat/suggest-items:
    post:
      operationId: suggestMenuItems
      tags: [chat]
      summary: Get AI menu item suggestions based on event details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestItemsBody"
      responses:
        "200":
          description: Suggested menu items with quantities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestItemsResponse"

  # Admin stats
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get dashboard stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  # Idle activity (in-process counters; resets on server restart)
  /admin/idle-activity:
    get:
      operationId: getAdminIdleActivity
      tags: [admin]
      summary: Background traffic counters since the server last restarted
      responses:
        "200":
          description: Idle activity snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdleActivitySnapshot"

  # OpenAI conversations (generic, kept for compatibility)
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOpenaiConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOpenaiMessageBody"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MenuItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: number
        servingSize:
          type: integer
          description: Number of people one unit serves
        unit:
          type: string
          description: e.g. "tray", "dozen", "per person"
        imageUrl:
          type: string
          nullable: true
        allergens:
          type: array
          items:
            type: string
        available:
          type: boolean
        prepTime:
          type: string
          nullable: true
        minimumOrderQty:
          type: integer
          description: Minimum quantity required to add this item to an order
          default: 1
        tier2Qty:
          type: integer
          nullable: true
          description: Minimum quantity to unlock tier 2 pricing
        tier2Price:
          type: number
          nullable: true
          description: Price per unit at tier 2
        tier3Qty:
          type: integer
          nullable: true
          description: Minimum quantity to unlock tier 3 pricing
        tier3Price:
          type: number
          nullable: true
          description: Price per unit at tier 3
        eventActive:
          type: boolean
          description: Whether this item is shown on the on-site event ordering page (guest-facing /event)
        eventTakerVisible:
          type: boolean
          description: Whether this item is shown on the staff Event Order Taker page (/event-taker)
        eventTakerPrice:
          type: number
          nullable: true
          description: Separate per-unit price for the staff Event Order Taker page (`/event-taker`). Strict — items with this null are hidden from the order taker (no fallback to `price`).
        eventStock:
          type: integer
          nullable: true
          description: Optional inventory cap for event ordering. Decremented on each event/POS order; null means unlimited.
        otdEligible:
          type: boolean
          description: Whether this item can be cooked fresh on-site as part of the "On the Dash Experience" food trailer service. Drop-off-only items default to false.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - category
        - price
        - servingSize
        - unit
        - allergens
        - available
        - minimumOrderQty
        - createdAt

    CreateMenuItemBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: number
        servingSize:
          type: integer
        unit:
          type: string
        imageUrl:
          type: string
          nullable: true
        allergens:
          type: array
          items:
            type: string
        available:
          type: boolean
        prepTime:
          type: string
          nullable: true
        minimumOrderQty:
          type: integer
        tier2Qty:
          type: integer
          nullable: true
        tier2Price:
          type: number
          nullable: true
        tier3Qty:
          type: integer
          nullable: true
        tier3Price:
          type: number
          nullable: true
        eventActive:
          type: boolean
        eventTakerVisible:
          type: boolean
        eventTakerPrice:
          type: number
          nullable: true
        eventStock:
          type: integer
          nullable: true
        otdEligible:
          type: boolean
      required:
        - name
        - description
        - category
        - price
        - servingSize
        - unit
        - allergens
        - available

    UpdateMenuItemBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: number
        servingSize:
          type: integer
        unit:
          type: string
        imageUrl:
          type: string
          nullable: true
        allergens:
          type: array
          items:
            type: string
        available:
          type: boolean
        prepTime:
          type: string
          nullable: true
        minimumOrderQty:
          type: integer
        tier2Qty:
          type: integer
          nullable: true
        tier2Price:
          type: number
          nullable: true
        tier3Qty:
          type: integer
          nullable: true
        tier3Price:
          type: number
          nullable: true
        eventActive:
          type: boolean
        eventTakerVisible:
          type: boolean
        eventTakerPrice:
          type: number
          nullable: true
        eventStock:
          type: integer
          nullable: true
        otdEligible:
          type: boolean

    RecommendedItem:
      type: object
      properties:
        menuItemId:
          type: integer
        name:
          type: string
        category:
          type: string
        available:
          type: boolean
        sortOrder:
          type: integer
        source:
          type: string
          enum: [manual, sync]
      required:
        - menuItemId
        - name
        - category
        - available
        - sortOrder
        - source

    TopSeller:
      type: object
      properties:
        menuItemId:
          type: integer
        name:
          type: string
        category:
          type: string
        totalQuantity:
          type: integer
        isCurrentlyRecommended:
          type: boolean
      required:
        - menuItemId
        - name
        - category
        - totalQuantity
        - isCurrentlyRecommended

    AddRecommendationBody:
      type: object
      properties:
        menuItemId:
          type: integer
          minimum: 1
      required:
        - menuItemId

    ReorderRecommendationsBody:
      type: object
      properties:
        menuItemIds:
          type: array
          items:
            type: integer
            minimum: 1
      required:
        - menuItemIds

    SyncRecommendationsBody:
      type: object
      properties:
        mode:
          type: string
          enum: [replace, merge]
        limit:
          type: integer
          minimum: 1
          maximum: 50
        menuItemIds:
          description: Optional subset of top-seller menu item IDs to apply. When omitted, all top sellers up to `limit` are applied.
          type: array
          items:
            type: integer
            minimum: 1
      required:
        - mode

    SyncRecommendationsResponse:
      type: object
      properties:
        mode:
          type: string
          enum: [replace, merge]
        applied:
          type: integer
        list:
          type: array
          items:
            $ref: "#/components/schemas/RecommendedItem"
      required:
        - mode
        - applied
        - list

    BlackoutDate:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - date
        - createdAt

    CreateBlackoutDateBody:
      type: object
      properties:
        date:
          type: string
          format: date
        reason:
          type: string
          nullable: true
      required:
        - date

    AvailabilityResponse:
      type: object
      properties:
        available:
          type: boolean
        blackoutDates:
          type: array
          items:
            type: string
            format: date
        suggestedDates:
          type: array
          items:
            type: string
            format: date
      required:
        - available
        - blackoutDates
        - suggestedDates

    CartItem:
      type: object
      properties:
        id:
          type: integer
        menuItemId:
          type: integer
        menuItem:
          $ref: "#/components/schemas/MenuItem"
        quantity:
          type: integer
        sizeSlot:
          type: integer
          nullable: true
        sizeLabel:
          type: string
          nullable: true
        sizePrice:
          type: number
          nullable: true
      required:
        - id
        - menuItemId
        - menuItem
        - quantity

    Cart:
      type: object
      properties:
        sessionId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        total:
          type: number
      required:
        - sessionId
        - items
        - total

    AddToCartBody:
      type: object
      properties:
        sessionId:
          type: string
        menuItemId:
          type: integer
        quantity:
          type: integer
        sizeSlot:
          type: integer
          nullable: true
        sizeLabel:
          type: string
          nullable: true
        sizePrice:
